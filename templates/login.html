{% extends 'base.html' %}
{% block content %}
<div class="bg-black min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card bg-dark border-danger border-2 rounded-4 p-4 shadow-lg">
                    <div class="text-center mb-4">
                        <h2 class="fw-black text-white text-uppercase">Acceso <span class="text-danger">Perfil</span></h2>
                        <p class="text-secondary small">Inicia sesión para acceder a tu perfil</p>
                    </div>

                    {% set messages = get_flashed_messages({with_categories: true}) %}
                    {% if messages.length > 0 %}
                      {% for category, message in messages %}
                        <div class="alert alert-{{ category }} small py-2">{{ message }}</div>
                      {% endfor %}
                    {% endif %}

                    <form action="/login" method="POST">
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">CORREO ÚNICO</label>
                            <input type="email" name="email" class="form-control bg-black border-secondary text-white" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-bold">CONTRASEÑA</label>
                            <input type="password" name="password" class="form-control bg-black border-secondary text-white" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 fw-black rounded-pill py-2">ENTRAR AL SISTEMA</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
